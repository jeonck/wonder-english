baseURL = 'https://jeonck.github.io/wonder-english/'
locale = 'ko-kr'
title = 'Wonder English'
theme = 'PaperMod'
paginate = 10

[params]
  env = 'production'
  title = 'Wonder English'
  description = '소설 Wonder를 챕터별로 읽으며 영어 원어민 표현을 익히는 블로그'
  author = 'jeonck'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = 'Wonder English'
    Content = 'R.J. Palacio의 소설 **Wonder**를 챕터별로 읽으며 영어 원어민 표현을 익히는 블로그입니다.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/jeonck'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']
